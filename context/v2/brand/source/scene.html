<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none}
.vignette{background:radial-gradient(ellipse at 50% 46%,transparent 40%,rgba(2,4,4,.55) 78%,rgba(1,2,2,.92) 100%)}
.grain{opacity:.07;mix-blend-mode:overlay}
.bars:before,.bars:after{content:"";position:absolute;left:0;right:0;height:8%;background:#020303}
.bars:before{top:0}.bars:after{bottom:0}
.title{position:absolute;left:0;right:0;text-align:center;color:#efe4c6;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.title .name{font-weight:300;font-size:var(--name,30px);letter-spacing:.78em;padding-left:.78em;text-shadow:0 0 22px rgba(255,200,130,.35)}
.title .rule{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:var(--gap,14px);font-weight:600;font-size:var(--sub,11px);letter-spacing:.6em;padding-left:.6em;color:#c9a35a}
.title .rule i{display:block;width:var(--line,80px);height:1px;background:linear-gradient(90deg,transparent,#c9a35a)}
.title .rule i:last-child{transform:scaleX(-1)}
</style></head><body><div id="stage"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const P = new URLSearchParams(location.search);
const MODE = P.get('mode') || 'keyart';          // keyart | logo | emblem
const TEXT = MODE === 'emblem' ? 'D' : 'DIN';
const W = innerWidth, H = innerHeight, stage = document.getElementById('stage');
const rnd = (() => { let s = +(P.get('seed') || 7); return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H); renderer.setClearColor(0, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .35;
const camera = new THREE.PerspectiveCamera(MODE === 'emblem' ? 26 : 24, W / H, .1, 500);

// ---------- materials ----------
const face = new THREE.MeshPhysicalMaterial({ color: '#efe3c2', roughness: .42, metalness: .05, clearcoat: .35, clearcoatRoughness: .4 });
const side = new THREE.MeshPhysicalMaterial({ color: '#b98d45', roughness: .32, metalness: .95 });
const ember = new THREE.MeshStandardMaterial({ color: '#2a1a08', emissive: new THREE.Color('#ffb040'), emissiveIntensity: 3.2 });
// a few cubes are grass blocks: the world forming as the letters break apart
function pixTex(draw) { const c = document.createElement('canvas'); c.width = c.height = 16; draw(c.getContext('2d')); const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; }
const pick = a => a[Math.floor(rnd() * a.length)];
const gTop = pixTex(g => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = pick(['#7fae45', '#8fbe52', '#6f9e3c', '#9bc95c']); g.fillRect(x, y, 1, 1); } });
const gSide = pixTex(g => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = pick(['#86603f', '#7a5739', '#93694a', '#6c4d34']); g.fillRect(x, y, 1, 1); } for (let x = 0; x < 16; x++) { const d = 3 + Math.floor(rnd() * 3); for (let y = 0; y < d; y++) { g.fillStyle = pick(['#7fae45', '#8fbe52', '#6f9e3c']); g.fillRect(x, y, 1, 1); } } });
const gs = new THREE.MeshStandardMaterial({ map: gSide, roughness: .8 }), gt = new THREE.MeshStandardMaterial({ map: gTop, roughness: .8 });
const GRASS = [gs, gs, gt, gs, gs, gs];

// ---------- letters ----------
const font = await new Promise((ok, no) => new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', ok, undefined, no));
const SIZE = 7, DEPTH = 2.0;
const geo = new TextGeometry(TEXT, { font, size: SIZE, height: DEPTH, curveSegments: 16, bevelEnabled: true, bevelThickness: .22, bevelSize: .12, bevelSegments: 5 });
geo.computeBoundingBox(); const bb = geo.boundingBox; const cx = (bb.max.x + bb.min.x) / 2;
geo.translate(-cx, -bb.min.y, -(bb.max.z + bb.min.z) / 2); geo.computeBoundingBox();
const B = geo.boundingBox, width = B.max.x - B.min.x;
const logo = new THREE.Group(); scene.add(logo);

// break-up front: solid where u = x + k*y < cut
const K = .22, CUT = B.min.x + width * (MODE === 'emblem' ? .84 : MODE === 'logo' ? .9 : .87);
const n = new THREE.Vector3(-1, -K, 0); const len = n.length(); n.normalize();
const clip = new THREE.Plane(n, CUT / len);       // keeps points where n·p + c >= 0  ->  x + K*y <= CUT
const faceC = face.clone(), sideC = side.clone(); faceC.clippingPlanes = sideC.clippingPlanes = [clip]; faceC.clipShadows = sideC.clipShadows = true;
const solid = new THREE.Mesh(geo, [faceC, sideC]); solid.castShadow = solid.receiveShadow = true; logo.add(solid);

// voxelise the letters beyond the cut by ray-testing the solid shape
const probe = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
const ray = new THREE.Raycaster(); const V = .36, cubes = [];
const zLayers = Math.max(1, Math.round((B.max.z - B.min.z) / V));
for (let y = B.min.y + V / 2; y < B.max.y; y += V) for (let x = B.min.x + V / 2; x < B.max.x; x += V) {
  const u = x + K * y; if (u < CUT - V) continue;
  ray.set(new THREE.Vector3(x, y, 50), new THREE.Vector3(0, 0, -1));
  if (!ray.intersectObject(probe).length) continue;
  for (let zi = 0; zi < zLayers; zi++) cubes.push({ x, y, z: B.max.z - V / 2 - zi * V, d: u - CUT });
}
const dMax = Math.max(...cubes.map(c => c.d));
const buckets = new Map(); const add = (mats, m) => { if (!buckets.has(mats)) buckets.set(mats, []); buckets.get(mats).push(m); };
const FACE = [side, side, side, side, face, side];
for (const c of cubes) {
  const t = Math.max(0, c.d) / dMax;                    // 0 at the break, 1 at the far edge
  const noise = (rnd() - .5) * .35;
  const loose = t + noise > .2;
  if (loose && rnd() < Math.min(.85, (t + noise) * 1.25)) continue;  // thin out as it disperses
  const m = new THREE.Matrix4();
  if (!loose) { m.makeTranslation(c.x, c.y, c.z); add(FACE, m); continue; }
  const f = Math.pow(t + Math.max(0, noise), 1.6);
  const pos = new THREE.Vector3(c.x + f * (3.5 + rnd() * 3), c.y + f * (4 + rnd() * 5), c.z + f * (rnd() * 6 - 1));
  const rot = new THREE.Euler(f * (rnd() - .5) * 5, f * (rnd() - .5) * 5, f * (rnd() - .5) * 5);
  const s = 1 - f * .45 * rnd();
  m.compose(pos, new THREE.Quaternion().setFromEuler(rot), new THREE.Vector3(s, s, s));
  const r = rnd();
  add(r < .07 ? [ember, ember, ember, ember, ember, ember] : (f > .5 && r < .2) ? GRASS : FACE, m);
}
const cube = new THREE.BoxGeometry(V * .96, V * .96, V * .96);
for (const [mats, list] of buckets) { const im = new THREE.InstancedMesh(cube, mats, list.length); list.forEach((m, i) => im.setMatrixAt(i, m)); im.castShadow = im.receiveShadow = true; logo.add(im); }

// ---------- lights ----------
const key = new THREE.SpotLight('#ffd7a0', 260, 120, .42, .6, 1.6); key.position.set(-14, 22, 24); key.target.position.set(0, 3, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0004; scene.add(key, key.target);
const rim = new THREE.DirectionalLight('#7fe0c0', 2.2); rim.position.set(18, 10, -20); scene.add(rim);
const rim2 = new THREE.DirectionalLight('#ffb070', 1.4); rim2.position.set(-20, 4, -16); scene.add(rim2);
const fill = new THREE.HemisphereLight('#2d3b38', '#0a0806', .5); scene.add(fill);
const glow = new THREE.PointLight('#ffb040', 14, 12, 2); glow.position.set(B.min.x + width * .8, 5, 2); logo.add(glow);

// ---------- environment ----------
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
if (MODE !== 'logo') {
  scene.background = new THREE.Color('#050807');
  scene.fog = new THREE.Fog('#050807', 40, 120);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshPhysicalMaterial({ color: '#0b100e', roughness: .28, metalness: .2, clearcoat: .6, clearcoatRoughness: .25 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // haze glow behind the letters
  const hc = document.createElement('canvas'); hc.width = hc.height = 256; const hg = hc.getContext('2d'); const gr = hg.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(90,130,110,.32)'); gr.addColorStop(.35, 'rgba(50,75,62,.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); hg.fillStyle = gr; hg.fillRect(0, 0, 256, 256);
  const ht = new THREE.CanvasTexture(hc); ht.colorSpace = THREE.SRGBColorSpace;
  const haze = new THREE.Sprite(new THREE.SpriteMaterial({ map: ht, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  haze.position.set(2, 5, -30); haze.scale.set(90, 55, 1); scene.add(haze);
  // dust motes in the key light
  const N = 600, pos = new Float32Array(N * 3); for (let i = 0; i < N; i++) { pos[i * 3] = (rnd() - .5) * 60; pos[i * 3 + 1] = rnd() * 22; pos[i * 3 + 2] = -25 + rnd() * 40; }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dc = document.createElement('canvas'); dc.width = dc.height = 32; const dg = dc.getContext('2d'); const dgr = dg.createRadialGradient(16, 16, 0, 16, 16, 16); dgr.addColorStop(0, 'rgba(255,225,180,1)'); dgr.addColorStop(1, 'rgba(255,200,140,0)'); dg.fillStyle = dgr; dg.fillRect(0, 0, 32, 32);
  scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ size: .16, map: new THREE.CanvasTexture(dc), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .7 })));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .35, .5, .92));
}
composer.addPass(new OutputPass());

if (MODE === 'emblem') { camera.position.set(-1, 4, 27); camera.lookAt(1.6, 4.4, 0); logo.rotation.y = .14; }
else if (MODE === 'logo') { camera.position.set(-2, 3.6, 46); camera.lookAt(1.2, 4.6, 0); logo.rotation.y = .16; }
else { camera.position.set(-5, 2.4, 50); camera.lookAt(1.2, 2.2, 0); logo.rotation.y = .16; }

// ---------- 2D overlays ----------
function addFx() {
  const v = document.createElement('div'); v.className = 'fx vignette'; stage.appendChild(v);
  const g = document.createElement('canvas'); g.className = 'fx grain'; g.width = W; g.height = H; const gc = g.getContext('2d'); const id = gc.createImageData(W, H);
  for (let i = 0; i < id.data.length; i += 4) { const q = 128 + (rnd() - .5) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = q; id.data[i + 3] = 255; } gc.putImageData(id, 0, 0); stage.appendChild(g);
}
function addTitle(top, scale = 1) {
  const t = document.createElement('div'); t.className = 'title'; t.style.top = top;
  for (const [k, v] of [['--name', 30], ['--sub', 11], ['--gap', 14], ['--line', 80]]) t.style.setProperty(k, `${v * scale}px`);
  t.innerHTML = '<div class="name">JON VINCENT DIN</div><div class="rule"><i></i>WORLD OF BUILDS<i></i></div>'; stage.appendChild(t);
}
if (MODE === 'keyart') { addFx(); if (P.get('title') !== '0') addTitle('77%', W / 1920 * 1.2); const b = document.createElement('div'); b.className = 'fx bars'; stage.appendChild(b); }
if (MODE === 'emblem') addFx();
if (MODE === 'logo' && P.get('title') !== '0') addTitle('80%', W / 1200 * 1.1);

for (let i = 0; i < 3; i++) MODE === 'logo' ? renderer.render(scene, camera) : composer.render();
window.__done = true;
</script></body></html>
