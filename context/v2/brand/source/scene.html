<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DIN brand</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;600&display=block" rel="stylesheet">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script>
// DIN — enchanted. Modes: keyart | logo (transparent; &title=0 for the mark only) | emblem.
const Q = new URLSearchParams(location.search), MODE = Q.get('mode') || 'keyart', TITLE = Q.get('title') !== '0';
const W = innerWidth, H = innerHeight, dpr = devicePixelRatio, cv = document.getElementById('c');
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);
let seed = +(Q.get('seed') || 5); const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const COL = { white: '#f6f1ff', lilac: '#cdb8ff', violet: '#8f6be8', indigo: '#3a2a78', teal: '#7ff5e0', bg0: '#0a0812', bg1: '#140f24', cream: '#eee3be', gold: '#c9a35a' };

// Original abstract runes: a stem, a tick or two and a detached dot on a 4x5 grid. Not letters, not a copied script.
function makeRune() {
  const m = Array.from({ length: 5 }, () => [0, 0, 0, 0]);
  const stem = Math.floor(rnd() * 4), from = Math.floor(rnd() * 2), to = 3 + Math.floor(rnd() * 2);
  for (let y = from; y <= to; y++) m[y][stem] = 1;
  for (let k = 0; k < 1 + Math.floor(rnd() * 2); k++) { const y = from + Math.floor(rnd() * (to - from + 1)), dir = stem < 2 ? 1 : -1, len = 1 + Math.floor(rnd() * 2); for (let i = 1; i <= len; i++) { const x = stem + dir * i; if (x >= 0 && x < 4) m[y][x] = 1; } }
  const dy = rnd() < .5 ? 0 : 4, dx = stem < 2 ? 3 : 0; if (!m[dy][dx]) m[dy][dx] = 1;
  return m;
}
const RUNES = Array.from({ length: 16 }, makeRune);
function rune(x, y, u, alpha, color) {
  const r = RUNES[Math.floor(rnd() * RUNES.length)]; g.globalAlpha = alpha; g.fillStyle = color;
  r.forEach((row, j) => row.forEach((k, i) => k && g.fillRect(Math.round(x + i * u), Math.round(y + j * u), Math.ceil(u), Math.ceil(u)))); g.globalAlpha = 1;
}
// Runes drift in two loose clusters either side of the word, rising toward it and fading as they near it.
function runeStream(cx, cy, halfW, height, count, uMax, reach = .9) {
  g.save(); g.shadowColor = COL.violet; g.shadowBlur = uMax * 3;
  for (let i = 0; i < count; i++) {
    const side = i % 2 ? 1 : -1, t = rnd();                // t: 0 = outer and low, 1 = close to the word
    const x = cx + side * (halfW + (1 - t) * halfW * reach + rnd() * halfW * .15);
    const y = cy + height * (.45 - t * .7) + (rnd() - .5) * height * .3;
    const u = Math.max(1.4, uMax * (.55 + rnd() * .45));
    rune(x - 2 * u, y - 2.5 * u, u, .25 + .55 * t, rnd() < .3 ? COL.teal : COL.lilac);
  }
  g.restore();
}
// The enchanted word: soft violet glow, smooth lilac-to-indigo fill, a crisp top light, two diagonal glint bands.
function enchanted(text, cx, cy, size, weight = 900) {
  const font = `${weight} ${size}px Cinzel`;
  g.save(); g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(150,105,255,.85)'; g.shadowBlur = size * .28; g.fillStyle = COL.indigo; g.fillText(text, cx, cy); g.restore();
  const oc = document.createElement('canvas'); oc.width = W * dpr; oc.height = H * dpr; const o = oc.getContext('2d'); o.scale(dpr, dpr);
  o.font = font; o.textAlign = 'center'; o.textBaseline = 'middle';
  const fill = o.createLinearGradient(0, cy - size * .42, 0, cy + size * .42);
  fill.addColorStop(0, COL.white); fill.addColorStop(.35, COL.lilac); fill.addColorStop(.7, COL.violet); fill.addColorStop(1, COL.indigo);
  o.fillStyle = fill; o.fillText(text, cx, cy);
  o.globalCompositeOperation = 'source-atop';
  const w = o.measureText(text).width;
  for (const [pos, wd, a] of [[.32, .05, .55], [.44, .022, .8]]) {
    const gl = o.createLinearGradient(cx - w / 2, cy - size / 2, cx + w / 2, cy + size / 2);
    gl.addColorStop(Math.max(0, pos - wd), 'rgba(127,245,224,0)'); gl.addColorStop(pos, `rgba(200,255,245,${a})`); gl.addColorStop(Math.min(1, pos + wd), 'rgba(127,245,224,0)');
    o.fillStyle = gl; o.fillRect(0, 0, W, H);
  }
  const top = o.createLinearGradient(0, cy - size * .42, 0, cy - size * .3); top.addColorStop(0, 'rgba(255,255,255,.7)'); top.addColorStop(1, 'rgba(255,255,255,0)');
  o.fillStyle = top; o.fillRect(0, 0, W, H);
  g.drawImage(oc, 0, 0, W, H);
  return w;
}
function credit(cx, y, scale) {
  g.save(); g.textAlign = 'center'; g.fillStyle = COL.cream; g.font = `300 ${22 * scale}px Inter`; g.letterSpacing = `${17 * scale}px`; g.fillText('JON VINCENT DIN', cx + 8 * scale, y);
  g.font = `600 ${10.5 * scale}px Inter`; g.letterSpacing = `${6.5 * scale}px`; g.fillStyle = COL.lilac; g.fillText('WORLD OF BUILDS', cx + 3 * scale, y + 28 * scale);
  const lw = 70 * scale; g.fillStyle = 'rgba(205,184,255,.5)'; g.fillRect(cx - 120 * scale - lw, y + 24 * scale, lw, 1); g.fillRect(cx + 120 * scale, y + 24 * scale, lw, 1); g.restore();
}
function backdrop(cy) {
  const bg = g.createRadialGradient(W / 2, cy, 0, W / 2, cy, Math.max(W, H) * .75);
  bg.addColorStop(0, COL.bg1); bg.addColorStop(1, COL.bg0); g.fillStyle = bg; g.fillRect(0, 0, W, H);
}
(async () => {
  await Promise.all(['900 100px Cinzel', '300 20px Inter', '600 10px Inter'].map(f => document.fonts.load(f)));
  if (MODE === 'keyart') {
    const cy = H * .45, size = H * .3; backdrop(cy);
    const w = enchanted('DIN', W / 2, cy, size); runeStream(W / 2, cy, w / 2 + size * .25, size, 26, H / 200);
    if (TITLE) credit(W / 2, H * .78, H / 720);
  } else if (MODE === 'emblem') {
    const cy = H * .53, size = H * .62; backdrop(cy);
    const w = enchanted('D', W / 2, cy, size); runeStream(W / 2, cy, w / 2 + size * .02, size * .9, 16, H / 120, .22);
  } else {
    const size = H * (TITLE ? .42 : .62), cy = TITLE ? H * .4 : H * .52;
    const w = enchanted('DIN', W / 2, cy, size); runeStream(W / 2, cy, w / 2 + size * .12, size, 18, size / 70, .4);
    if (TITLE) credit(W / 2, H * .8, H / 600 * 1.1);
  }
  window.__done = true;
})();
</script></body></html>
