<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIN — original model review</title><link rel="stylesheet" href="style.css"><style>
body{background:#eee9d9;color:#14291f;padding:35px 5vw}main{max-width:1200px;margin:auto}h1{font:32px JVD;margin:25px 0}p{color:#546656}select,button{font:16px Arial;padding:12px;background:#d8dfc7;color:#14291f;border:0}label{display:block;margin:25px 0 15px}.controls{display:flex;gap:10px;flex-wrap:wrap}canvas{display:block;width:100%;height:580px}.caption{display:flex;justify-content:space-between;font-size:14px}a{color:inherit}@media(max-width:760px){canvas{height:380px}h1{font-size:25px}.caption{display:block}}
</style></head><body><main><a href="index.html">← Portfolio concept</a><h1>Crafted for the work.</h1><p>Original voxel model drafts · local procedural geometry · existing VoxelView renderer.</p><label>Review model <select id="model"><option value="portfolio-studio">Portfolio studio</option><option value="gallery-display">Gallery display</option><option value="workshop-lantern">Workshop lantern</option><option value="builder-journal">Builder journal</option></select></label><div class="controls"><button data-pose="front">Front</button><button data-pose="side">Side</button><button data-pose="oblique">Oblique</button></div><canvas id="model-canvas" role="img" aria-label="Original voxel model review"></canvas><div class="caption"><span id="caption"></span><span>Drag to inspect · no canonical assets replaced</span></div></main><script type="module">
import {VoxelView} from '../../../src/components/three/renderer.js';import{createModels}from'./model-sources.mjs';
const models=createModels();let view,pose='oblique';const select=document.querySelector('#model'),canvas=document.querySelector('canvas');
function setPose(p){pose=p;const v={front:[0,0],side:[Math.PI/2,.10],oblique:[.50,.38]}[p];view.angle=view.target=v[0];view.elevation=v[1];view.draw();document.querySelector('#caption').textContent=select.options[select.selectedIndex].text+' · '+p+' view';}
function load(){if(view)view.set(models[select.value]);else view=new VoxelView(canvas,models[select.value],{paused:()=>true});setPose(pose);}
select.onchange=load;document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>setPose(b.dataset.pose));load();await document.fonts.ready;view.draw();window.__modelReview={get view(){return view;},select(id,p){select.value=id;load();setPose(p);},models};window.__ready=true;addEventListener('pagehide',()=>view.destroy(),{once:true});
</script></body></html>
