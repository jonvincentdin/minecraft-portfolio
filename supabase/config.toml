# Settings pushed to the hosted project with `supabase config push`. Only declared properties are changed.
project_id = "jvd-world"

[auth]
# Owner password recovery returns to v1; preserve local development access.
site_url = "https://minecraft-portfolio-v1.vercel.app"
additional_redirect_urls = ["https://minecraft-portfolio-v1.vercel.app", "http://127.0.0.1:5173"]
# Owner and editors are created by an administrator and enrolled in portfolio_editors; nobody signs up.
enable_signup = false
